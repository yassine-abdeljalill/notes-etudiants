# Pipeline d'intégration continue de l'application des notes
name: CI

# Quand le pipeline se lance
on:
  # À chaque modification envoyée sur main
  push:
    branches: [main]

  # À chaque pull request
  pull_request:
    branches: [main]

  # Déclenchement manuel
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest flake8 bandit

      - name: Vérifier le style
        run: flake8 --max-line-length=100 *.py

      - name: Analyser la sécurité du code
        run: bandit app.py auth.py

      - name: Lancer les tests
        run: pytest -v


  # Livraison : publier l'image de l'application
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Le registre exige un nom d'image en minuscules
      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Connexion au registre GitHub
      - name: Connexion au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construire et publier l'image
      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

